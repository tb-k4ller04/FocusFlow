<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbeitszeiten - FocusFlow</title>
    <link rel="icon" href="accessories-clock-2.ico" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  </head>
  <body>
    <button class="theme-toggle" aria-label="Theme wechseln">🌙</button>
    <header class="header">
      <h1>⏰ Arbeitszeiten</h1>
      <a class="home-button" href="index.html" onclick="returnToFocusFlow(event)">← Zurück zu FocusFlow</a>
    </header>

    <main class="app">
      <div class="card wide collapsible-card">
        <button type="button" class="collapsible-header" aria-expanded="true">
          <span>⏱️ Neue Zeit hinzufügen</span>
          <span class="collapse-indicator">▾</span>
        </button>
        <div class="collapsible-content">
          <form id="timeForm" class="form-group">
            <div class="form-row">
              <label for="dateInput">Datum:</label>
              <input type="date" id="dateInput" required />
            </div>
            <div class="form-row">
              <label for="entryTypeInput">Art des Eintrags:</label>
              <select id="entryTypeInput">
                <option value="work">Arbeitszeit</option>
                <option value="comp-time">Freizeitausgleich</option>
                <option value="vacation">Urlaubstag</option>
                <option value="sick">Krankheitstag</option>
              </select>
            </div>
            <div class="form-row">
              <label for="timeInput" id="timeInputLabel">Ereigniszeit:</label>
              <input type="time" id="timeInput" required />
            </div>
            <div class="button-group">
              <button type="button" id="saveStartBtn" class="btn-primary">Einstempeln speichern</button>
              <button type="button" id="saveEndBtn" class="btn-primary">Ausstempeln speichern</button>
              <button type="button" id="saveDayBtn" class="btn-primary" hidden>Tag speichern</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card wide collapsible-card">
        <button type="button" class="collapsible-header" aria-expanded="true">
          <span>⚙️ Stundenstand einstellen</span>
          <span class="collapse-indicator">▾</span>
        </button>
        <div class="collapsible-content">
          <form id="balanceSettingsForm" class="settings-form">
            <div class="form-row">
              <label for="dailyTargetInput">Tagesziel (Stunden):</label>
              <input type="number" id="dailyTargetInput" min="0" step="0.25" value="8.5" />
            </div>
            <div class="form-row">
              <label for="previousOvertimeInput">Vorhandene Überstunden (Stunden):</label>
              <input type="number" id="previousOvertimeInput" step="0.25" value="0" />
            </div>
            <button type="submit" class="btn-primary">Stand speichern</button>
          </form>
        </div>
      </div>

      <div class="card wide">
        <h2>📊 Überblick</h2>
        <div class="summary-grid">
          <div class="summary-box">
            <span>Gesamt Überstunden</span>
            <strong id="totalBalance">0h 00m</strong>
          </div>
          <div class="summary-box">
            <span>vorheriges Saldo</span>
            <strong id="previousBalance">0h 00m</strong>
          </div>
          <div class="summary-box">
            <span>Aktuell aus Stempelzeiten</span>
            <strong id="currentBalance">0h 00m</strong>
          </div>
        </div>

        <table id="timesTable">
          <thead>
            <tr>
              <th>Datum</th>
              <th>Startzeit</th>
              <th>Endzeit</th>
              <th>Gesamtzeit (erst ab 06:30)</th>
              <th>Pause</th>
              <th>Netto</th>
              <th>Soll</th>
              <th>Delta</th>
              <th>Aktion</th>
            </tr>
          </thead>
          <tbody>
            <!-- Zeiten werden hier dynamisch eingefügt -->
          </tbody>
        </table>
        <div class="button-group">
          <button id="exportTimesBtn" class="btn-primary" type="button">Excel exportieren</button>
          <button id="clearBtn" class="btn-danger" type="button">Alle Zeiten löschen</button>
        </div>
      </div>
    </main>

    <script src="zeiten.js"></script>
  </body>
</html>
